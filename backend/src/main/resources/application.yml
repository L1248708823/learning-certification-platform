spring:
  application:
    name: learning-platform

  # 单数据源：JDBC URL 指向 iam 库，content / learning 的表通过全限定表名访问（禁止跨 schema join）
  datasource:
    # 本机不装 Docker，依赖容器跑在云服务器上，本机通过 SSH 隧道访问（见 learning-records/0003）。
    # 隧道端口 13306 对应服务器 lp-mysql 的 3306，账号用 lp_dev。
    # 真实密码只存在于服务器 /etc/learning-platform/learning-platform.env 的 MYSQL_APP_PASSWORD，
    # 通过环境变量 DB_PASSWORD 注入，不写入仓库。
    url: ${DB_URL:jdbc:mysql://127.0.0.1:13306/iam?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:lp_dev}
    password: ${DB_PASSWORD:请设置环境变量 DB_PASSWORD}

  # Flyway 基线：history 表 flyway_schema_history 自动落在 iam 库，迁移脚本见 db/migration/
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        # 只暴露 health 和 info，其他端点按需开放
        include: health,info
  endpoint:
    health:
      # 本地开发显示详细组件状态，方便排查；生产应关闭
      show-details: always
