spring:
  application:
    name: learning-platform

  # 单数据源：JDBC URL 指向 iam 库，content / learning 的表通过全限定表名访问（禁止跨 schema join）
  datasource:
    url: jdbc:mysql://localhost:3306/iam?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root

  # Flyway 基线：history 表 flyway_schema_history 自动落在 iam 库，迁移脚本见 db/migration/
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        # 只暴露 health 和 info，其他端点按需开放
        include: health,info
  endpoint:
    health:
      # 本地开发显示详细组件状态，方便排查；生产应关闭
      show-details: always
