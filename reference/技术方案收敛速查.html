<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">

  <title>技术方案收敛速查</title>
  <link rel="stylesheet" href="../assets/lesson.css">
</head>
<body>
  <main class="page">
    <p class="eyebrow">REFERENCE</p>
    <h1>技术方案收敛速查</h1>
    <p class="lead">把局部探索转化为主流程基线，保留证据，控制长期复杂度。</p>

    <section class="card">
      <h2>五步流程</h2>
      <ol>
        <li>定义真实问题和公开边界。</li>
        <li>选择两到三种值得比较的候选方案。</li>
        <li>用小切片、测试或原型验证关键差异。</li>
        <li>选择主流程基线，写完整实现。</li>
        <li>记录理由、延期方案和重新评估触发条件。</li>
      </ol>
    </section>

    <section class="card">
      <h2>每次比较都回答</h2>
      <ul>
        <li>它解决当前哪个业务或维护问题？</li>
        <li>团队和项目规模是否适合？</li>
        <li>学习成本、运行成本和迁移成本是什么？</li>
        <li>如何用最小测试证明选择有效？</li>
        <li>什么变化会触发重新评估？</li>
      </ul>
    </section>

    <p class="backlink"><a href="../lessons/0001-技术方案探索与收敛.html">返回第一课</a></p>
  </main>
</body>
</html>
